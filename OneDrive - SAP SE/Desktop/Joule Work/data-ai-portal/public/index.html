<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SAP Data &amp; AI PS Portal</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
/* ── Design tokens ──────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#0070b1;--dark:#003366;--gold:#f0ab00;
  --green:#107e3e;--orange:#e9730c;--red:#bb0000;--purple:#7b5ea7;
  --bg:#eef1f5;--card:#fff;--text:#32363a;--muted:#6a6d73;
  --border:#d9dadb;--surface:#f5f7fa;
  --sh-sm:0 1px 3px rgba(0,0,0,.08);
  --sh:0 2px 8px rgba(0,0,0,.10);
  --sh-md:0 4px 16px rgba(0,0,0,.13);
  --sh-lg:0 8px 32px rgba(0,0,0,.18);
  --r:8px;--r-sm:4px;--r-lg:12px;
  --tr:all .18s ease;
}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}

/* ── Header ─────────────────────────────────────────────────── */
.hdr{background:linear-gradient(135deg,#001225 0%,#002244 45%,#004a80 100%);color:#fff;padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:68px;position:sticky;top:0;z-index:300;box-shadow:0 2px 16px rgba(0,0,0,.4)}
.logo{width:42px;height:42px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#fff;margin-right:14px;flex-shrink:0;box-shadow:0 2px 8px rgba(240,171,0,.45)}
.hdr-title{font-size:17px;font-weight:700;letter-spacing:-.2px}
.hdr-sub{font-size:11px;opacity:.65;margin-top:1px}
.hdr-badge{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:5px 13px;font-size:11px;font-weight:600;backdrop-filter:blur(4px)}
.hdr-dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 6px currentColor;flex-shrink:0}

/* ── Nav ────────────────────────────────────────────────────── */
.nav{background:var(--card);border-bottom:1px solid var(--border);display:flex;padding:0 20px;position:sticky;top:68px;z-index:200;align-items:center;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.nav-tabs{display:flex;overflow-x:auto;flex:1;min-width:0}
.nav-tabs::-webkit-scrollbar{height:0}
.nav-search{display:flex;align-items:center;gap:6px;padding:8px 0 8px 16px;flex-shrink:0;border-left:1px solid var(--border);margin-left:8px}
.nav-search input{padding:7px 12px;border:1px solid var(--border);border-radius:20px;font-size:12px;outline:none;width:220px;background:var(--surface);transition:var(--tr)}
.nav-search input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px #0070b118}
.nav-search button{padding:7px 16px;background:var(--blue);color:#fff;border:none;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;transition:var(--tr)}
.nav-search button:hover{background:var(--dark)}
.nbtn{padding:14px 16px;border:none;background:none;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;transition:var(--tr)}
.nbtn.on,.nbtn:hover{color:var(--blue);border-bottom-color:var(--blue)}
.nbtn.on{font-weight:700}

/* ── Main layout ─────────────────────────────────────────────── */
.main{max-width:1520px;margin:0 auto;padding:24px 20px}

/* ── KPI row ─────────────────────────────────────────────────── */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.kpi{background:var(--card);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--sh);border-top:3px solid var(--blue);cursor:pointer;transition:var(--tr);position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;bottom:-24px;right:-24px;width:90px;height:90px;border-radius:50%;background:var(--blue);opacity:.04;transition:var(--tr)}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
.kpi:hover::after{opacity:.09}
.kpi.g{border-top-color:var(--green)}.kpi.g::after{background:var(--green)}
.kpi.o{border-top-color:var(--orange)}.kpi.o::after{background:var(--orange)}
.kpi.r{border-top-color:var(--red)}.kpi.r::after{background:var(--red)}
.kpi.p{border-top-color:var(--purple)}.kpi.p::after{background:var(--purple)}
.kpi.gd{border-top-color:var(--gold)}.kpi.gd::after{background:var(--gold)}
.kl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.9px;font-weight:700;margin-bottom:6px}
.kv{font-size:34px;font-weight:800;color:#003366;line-height:1;letter-spacing:-1px}
.ks{font-size:11px;color:var(--muted);margin-top:5px;font-weight:500}

/* ── Cards ───────────────────────────────────────────────────── */
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh);margin-bottom:18px;overflow:hidden}
.card-hdr{padding:14px 18px;font-size:13px;font-weight:700;color:#003366;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to right,var(--surface),var(--card))}

/* ── Journey kanban ──────────────────────────────────────────── */
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px}
@media(max-width:1100px){.kanban{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.kanban{grid-template-columns:1fr}}
.kol-head{padding:10px 14px;border-radius:var(--r) var(--r) 0 0;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;gap:7px;letter-spacing:.3px}
.kol-body{background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--r) var(--r);padding:8px;min-height:180px;display:flex;flex-direction:column;gap:6px}
.svc{background:var(--card);border-radius:var(--r-sm);padding:10px 12px;border:1px solid var(--border);cursor:pointer;transition:var(--tr)}
.svc:hover{box-shadow:var(--sh-md);transform:translateY(-2px);border-color:#c0c4c8}

/* ── Table ───────────────────────────────────────────────────── */
.ttoolbar{padding:12px 16px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--border);background:var(--surface)}
input[type=search],select{padding:7px 10px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:12px;outline:none;background:#fff;transition:var(--tr)}
input[type=search]{width:200px}
input[type=search]:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #0070b118}
table{width:100%;border-collapse:collapse}
thead tr{background:linear-gradient(to bottom,#003d72,#003366)}
th{padding:10px 14px;text-align:left;font-size:10px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.6px;cursor:pointer;white-space:nowrap;user-select:none;border-right:1px solid rgba(255,255,255,.1)}
th:last-child{border-right:none}
th:hover{background:rgba(255,255,255,.1)}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
tbody tr:nth-child(even){background:#fafbfc}
tbody tr:hover{background:#e8f4fc}
td{padding:10px 14px;font-size:12px;vertical-align:middle}
.pager{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);border-top:1px solid var(--border);background:var(--surface)}
.pbtn{padding:5px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:#fff;cursor:pointer;font-size:11px;transition:var(--tr)}
.pbtn:hover{background:#e8f4fc;border-color:var(--blue)}.pbtn:disabled{opacity:.4;cursor:not-allowed}
.row-new{border-left:4px solid #0070b1!important}.row-update{border-left:4px solid #107e3e!important}
.row-merge{border-left:4px solid #e9730c!important}.row-split{border-left:4px solid #7b5ea7!important}
.row-retire{border-left:4px solid #bb0000!important}.row-active{border-left:4px solid #6a6d73!important}
.row-transfer{border-left:4px solid #f0ab00!important}

/* ── Pills / badges ──────────────────────────────────────────── */
.pill{display:inline-block;padding:3px 9px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap;letter-spacing:.4px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.15)}
.manual-badge{font-size:9px;font-weight:700;background:#e8f4fc;color:#0070b1;border:1px solid #0070b155;border-radius:4px;padding:1px 5px;vertical-align:middle;margin-left:4px}
.sku-link{color:var(--blue);font-weight:700;text-decoration:none;background:#e8f4fc;padding:2px 8px;border-radius:4px;font-size:11px;transition:var(--tr)}
.sku-link:hover{background:var(--blue);color:#fff}

/* ── Modal ───────────────────────────────────────────────────── */
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes slideup{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
.ov{display:none;position:fixed;inset:0;background:rgba(0,5,30,.55);backdrop-filter:blur(3px);z-index:500;align-items:center;justify-content:center;animation:fadein .18s ease}
.ov.show{display:flex}
.modal{background:var(--card);border-radius:var(--r-lg);width:min(700px,95vw);max-height:90vh;overflow-y:auto;box-shadow:var(--sh-lg);animation:slideup .2s ease}
.mhdr{padding:18px 22px;background:linear-gradient(135deg,#001225,#002e58,#004a80);color:#fff;border-radius:var(--r-lg) var(--r-lg) 0 0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.mbody{padding:22px}
.mfield{margin-bottom:14px}
.mfield label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;display:block;margin-bottom:4px}
.mfield .val{font-size:13px;color:var(--text);line-height:1.6;background:var(--surface);padding:9px 12px;border-radius:var(--r-sm);border:1px solid var(--border)}
.mhdr-btn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);color:#fff;cursor:pointer;border-radius:20px;padding:5px 13px;font-size:12px;font-weight:700;transition:var(--tr)}
.mhdr-btn:hover{background:rgba(255,255,255,.3)}
.mhdr-close{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);color:#fff;cursor:pointer;border-radius:50%;width:32px;height:32px;font-size:16px;line-height:32px;text-align:center;transition:var(--tr)}
.mhdr-close:hover{background:rgba(255,255,255,.3)}

/* ── Charts ──────────────────────────────────────────────────── */
.ch-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
@media(max-width:800px){.ch-row{grid-template-columns:1fr}}
.ch-inner{position:relative;height:230px}
.drill-hint{font-size:10px;color:var(--muted);font-style:italic;margin-left:8px}

/* ── Notices ─────────────────────────────────────────────────── */
.notice{padding:12px 16px;border-radius:var(--r-sm);font-size:12px;margin-bottom:18px;border-left:4px solid}
.notice.blue{background:#e8f4fc;border-color:var(--blue);color:#004a77}
.notice.orange{background:#fce8d5;border-color:var(--orange);color:#7a3500}
.notice.red{background:#f4d4d4;border-color:var(--red);color:#7a0000}
.notice.green{background:#d8f0e4;border-color:var(--green);color:#054a1e}

/* ── Refresh bar ─────────────────────────────────────────────── */
.rbar{display:flex;align-items:center;gap:12px;padding:11px 16px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:20px;flex-wrap:wrap;border-left:3px solid var(--blue)}
.rbtn{padding:7px 18px;background:var(--blue);color:#fff;border:none;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;transition:var(--tr);box-shadow:0 2px 6px rgba(0,112,177,.3)}
.rbtn:hover{background:var(--dark)}.rbtn:disabled{opacity:.5;cursor:not-allowed}
.rsrc{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:700}
.rsrc.live{background:#d8f0e4;color:var(--green)}.rsrc.seed{background:#fce8d5;color:var(--orange)}

/* ── Loading / Error states ──────────────────────────────────── */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.loader{text-align:center;padding:48px;color:var(--muted);font-size:13px;animation:pulse 1.6s infinite}
.err-state{text-align:center;padding:36px 20px;color:var(--red);font-size:13px;background:#fff8f8;border-radius:var(--r);border:1px solid #f4d4d4;margin:8px 0}
.err-state .retry{margin-top:12px;padding:6px 16px;background:var(--red);color:#fff;border:none;border-radius:20px;cursor:pointer;font-size:12px;font-weight:700}

/* ── Toast ───────────────────────────────────────────────────── */
@keyframes t-in{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes t-out{from{opacity:1}to{opacity:0;transform:translateX(110%)}}
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{min-width:240px;max-width:360px;padding:12px 16px;border-radius:var(--r);font-size:12px;font-weight:600;color:#fff;box-shadow:var(--sh-lg);display:flex;align-items:flex-start;gap:8px;line-height:1.4;animation:t-in .25s ease;pointer-events:auto}
.toast.leaving{animation:t-out .25s ease forwards}
.toast.success{background:var(--green)}.toast.error{background:var(--red)}.toast.info{background:var(--blue)}
.toast-icon{font-size:13px;flex-shrink:0;margin-top:1px}

/* ── Confirm dialog ──────────────────────────────────────────── */
.confirm-box{background:var(--card);border-radius:var(--r-lg);width:min(420px,92vw);box-shadow:var(--sh-lg);animation:slideup .2s ease}
.confirm-msg{padding:20px 22px;font-size:13px;color:var(--text);line-height:1.7}
.confirm-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* ── Buttons ─────────────────────────────────────────────────── */
.sbtn{padding:8px 20px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:none;transition:var(--tr)}
.sbtn.primary{background:var(--blue);color:#fff;box-shadow:0 2px 6px rgba(0,112,177,.28)}.sbtn.primary:hover{background:var(--dark)}
.sbtn.ghost{background:#fff;color:var(--text);border:1px solid var(--border)}.sbtn.ghost:hover{background:var(--surface)}
.sbtn.danger{background:var(--red);color:#fff}.sbtn.danger:hover{background:#990000}
.sbtn:disabled{opacity:.5;cursor:not-allowed}

/* ── Service form ────────────────────────────────────────────── */
.sform-ov{display:none;position:fixed;inset:0;background:rgba(0,5,30,.55);backdrop-filter:blur(3px);z-index:600;align-items:center;justify-content:center;animation:fadein .18s ease}
.sform-ov.show{display:flex}
.sform{background:var(--card);border-radius:var(--r-lg);width:min(720px,96vw);max-height:94vh;overflow-y:auto;box-shadow:var(--sh-lg);animation:slideup .2s ease}
.sform-hdr{padding:18px 22px;background:linear-gradient(135deg,#001225,#002e58,#004a80);color:#fff;border-radius:var(--r-lg) var(--r-lg) 0 0;display:flex;align-items:center;justify-content:space-between}
.sform-body{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sform-body .full{grid-column:1/-1}
.sform label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:4px}
.sform input,.sform select,.sform textarea{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:12px;font-family:inherit;outline:none;background:#fff;transition:var(--tr)}
.sform input:focus,.sform select:focus,.sform textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #0070b118}
.sform input:disabled{background:var(--surface);color:var(--muted);cursor:not-allowed}
.sform textarea{min-height:78px;resize:vertical}
.sform-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:var(--surface);border-radius:0 0 var(--r-lg) var(--r-lg)}
.sform-err{background:#fff0f0;border:1px solid #f4d4d4;border-radius:var(--r-sm);padding:8px 12px;font-size:11px;color:var(--red);font-weight:600}

/* ── DMLT ────────────────────────────────────────────────────── */
.dmlt-item{display:flex;gap:12px;padding:10px 6px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:var(--r-sm);transition:background .12s}
.dmlt-item:last-child{border-bottom:none}
.dmlt-item:hover{background:var(--surface)}
.dmlt-name{font-size:12px;font-weight:600;color:#003366;line-height:1.4}
.dmlt-note{font-size:10px;color:var(--orange);margin-top:3px}

/* ── Rules ───────────────────────────────────────────────────── */
.rule-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.rule-card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);border-left:4px solid var(--blue);transition:var(--tr)}
.rule-card:hover{box-shadow:var(--sh-md);transform:translateY(-2px)}
.rule-card h4{font-size:13px;font-weight:700;color:#003366;margin-bottom:8px}
.rule-body{font-size:12px;color:var(--text);margin-bottom:10px;line-height:1.6}
.rule-impact{font-size:11px;color:var(--text);background:var(--surface);border-radius:var(--r-sm);padding:7px 11px;border-left:3px solid var(--gold);line-height:1.5}

/* ── Retire cards ────────────────────────────────────────────── */
.retire-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:10px;cursor:pointer;overflow:hidden;transition:var(--tr)}
.retire-card:hover{box-shadow:var(--sh-md);transform:translateX(3px)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef, createContext, useContext } = React;
Chart.register(ChartDataLabels);

/* ─── Constants ──────────────────────────────────────────────── */
const CAT = 'https://servicescatalog.cvdp3eof-dbsservic1-p1-public.model-t.cc.commerce.ondemand.com/p/';
const STATUS_C = {
  'Active':'#107e3e','Active / TBD':'#5a8a00','Coming Dec 2026':'#0070b1',
  'Coming 2705':'#7b5ea7','Active — Merging':'#e9730c','Active — Transferring to Finance':'#f0ab00',
  'Retiring Jan 2027':'#bb0000','Retiring (Obsolete)':'#bb0000',
  'Retiring — Moving to Success Plans':'#bb0000','Retiring':'#bb0000',
};
const ACTION_C = {
  'NEW':'#0070b1','UPDATE':'#107e3e','MERGE':'#e9730c','SPLIT':'#7b5ea7',
  'RETIRE':'#bb0000','ACTIVE':'#6a6d73','TRANSFER':'#f0ab00',
};
const JOURNEY_C = {
  'New Implementation':'#0070b1','System Conversion':'#7b5ea7',
  'Expansion & Tuning':'#107e3e','DMLT Cross Services':'#e9730c',
  'System Migration / PEX':'#f0ab00','Retiring':'#bb0000','Uncategorised':'#6a6d73',
};
const JOURNEY_ICONS = {
  'New Implementation':'🆕','System Conversion':'🔄','Expansion & Tuning':'⚙️',
  'DMLT Cross Services':'🗂️','System Migration / PEX':'🚚','Retiring':'🔴',
};
const JOURNEYS = ['New Implementation','System Conversion','Expansion & Tuning','DMLT Cross Services','System Migration / PEX'];

/* ─── Toast system ───────────────────────────────────────────── */
const ToastCtx = createContext(null);
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const add = useCallback((msg, type) => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, msg, type, leaving: false }]);
    setTimeout(() => {
      setToasts(t => t.map(x => x.id === id ? { ...x, leaving: true } : x));
      setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 280);
    }, 3800);
  }, []);
  const icons = { success: '✓', error: '✕', info: 'ℹ' };
  return (
    <ToastCtx.Provider value={{ success: m => add(m,'success'), error: m => add(m,'error'), info: m => add(m,'info') }}>
      {children}
      <div className="toast-wrap">
        {toasts.map(t => (
          <div key={t.id} className={`toast ${t.type}${t.leaving ? ' leaving' : ''}`}>
            <span className="toast-icon">{icons[t.type]}</span>
            <span>{t.msg}</span>
          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}
const useToast = () => useContext(ToastCtx);

/* ─── Confirm dialog ─────────────────────────────────────────── */
const ConfirmCtx = createContext(null);
function ConfirmProvider({ children }) {
  const [state, setState] = useState(null);
  const confirm = useCallback(msg => new Promise(resolve => setState({ msg, resolve })), []);
  const respond = ok => { state && state.resolve(ok); setState(null); };
  return (
    <ConfirmCtx.Provider value={confirm}>
      {children}
      {state && (
        <div className="ov show" style={{ zIndex: 700 }} onClick={() => respond(false)}>
          <div className="confirm-box" onClick={e => e.stopPropagation()}>
            <div className="mhdr" style={{ borderRadius: '12px 12px 0 0' }}>
              <div style={{ fontSize: 14, fontWeight: 700 }}>⚠️ Confirm Action</div>
              <button className="mhdr-close" onClick={() => respond(false)}>✕</button>
            </div>
            <div className="confirm-msg">{state.msg}</div>
            <div className="confirm-foot">
              <button className="sbtn ghost" onClick={() => respond(false)}>Cancel</button>
              <button className="sbtn danger" onClick={() => respond(true)}>Confirm</button>
            </div>
          </div>
        </div>
      )}
    </ConfirmCtx.Provider>
  );
}
const useConfirm = () => useContext(ConfirmCtx);

/* ─── API helpers ────────────────────────────────────────────── */
const api = {
  get: async path => {
    const r = await fetch(`/api${path}`);
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || `HTTP ${r.status}`); }
    return r.json();
  },
  post: async (path, body) => {
    const opts = { method: 'POST', headers: body ? { 'Content-Type': 'application/json' } : {} };
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch(`/api${path}`, opts);
    const j = await r.json().catch(() => ({}));
    if (j.ok === undefined) j.ok = r.ok;
    return j;
  },
  put: async (path, body) => {
    const r = await fetch(`/api${path}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (j.ok === undefined) j.ok = r.ok;
    return j;
  },
  del: async path => {
    const r = await fetch(`/api${path}`, { method: 'DELETE' });
    const j = await r.json().catch(() => ({}));
    if (j.ok === undefined) j.ok = r.ok;
    return j;
  },
};

/* ─── Shared primitives ──────────────────────────────────────── */
function Pill({ text, colorMap }) {
  const c = colorMap[text] || '#6a6d73';
  return <span className="pill" style={{ background: c, color: '#fff' }}>{text}</span>;
}
function Loader() { return <div className="loader">⟳ Loading…</div>; }
function ErrState({ message, onRetry }) {
  return (
    <div className="err-state">
      <div>⚠️ {message || 'Failed to load data.'}</div>
      {onRetry && <button className="retry" onClick={onRetry}>↺ Retry</button>}

  );
}

/* ─── RefreshBar ─────────────────────────────────────────────── */
function RefreshBar({ meta, onRefresh, loading }) {
  const toast = useToast();
  if (!meta) return null;
  const isLive = meta.source === 'mcp-live';
  const doRefresh = async () => {
    const r = await onRefresh();
    if (r && (r.success || r.ok)) toast.success(r.message || 'MCP refresh complete.');
    else toast.error((r && (r.error || r.message)) || 'MCP refresh failed — is MCP_TOKEN set?');
  };
  return (
    <div className="rbar">
      <button className="rbtn" onClick={doRefresh} disabled={loading}>
        {loading ? '⟳ Refreshing…' : '⟳ Refresh from MCP'}
      </button>
      <span className={`rsrc ${isLive ? 'live' : 'seed'}`}>{isLive ? '● Live (MCP)' : '● Seed Data'}</span>
      <span style={{ fontSize: 11, color: 'var(--muted)' }}>
        Last refreshed: {meta.lastRefresh ? new Date(meta.lastRefresh).toLocaleString() : '—'}
      </span>
      {!isLive && (
        <span style={{ fontSize: 11, color: 'var(--muted)', marginLeft: 'auto', fontStyle: 'italic' }}>
          Set MCP_TOKEN env var to enable live data
        </span>
      )}
    </div>
  );
}

/* ─── Overview ───────────────────────────────────────────────── */
function Overview({ stats, onDrillDown }) {
  const chartRef1 = useRef(null), chartRef2 = useRef(null);
  const chart1 = useRef(null), chart2 = useRef(null);
  const drillRef = useRef(onDrillDown);
  useEffect(() => { drillRef.current = onDrillDown; });

  useEffect(() => {
    if (!stats) return;
    const byAction  = stats.byAction  || {};
    const byJourney = stats.byJourney || {};
    const maxAction = Math.max(...Object.values(byAction), 1);
    const total2    = Object.values(byJourney).reduce((a, b) => a + b, 0);

    if (chart1.current) { chart1.current.destroy(); chart1.current = null; }
    if (chart2.current) { chart2.current.destroy(); chart2.current = null; }

    chart1.current = new Chart(chartRef1.current, {
      type: 'bar',
      data: {
        labels: Object.keys(byAction),
        datasets: [{
          data: Object.values(byAction),
          backgroundColor: Object.keys(byAction).map(a => ACTION_C[a] || '#6a6d73'),
          hoverBackgroundColor: Object.keys(byAction).map(a => (ACTION_C[a] || '#6a6d73') + 'cc'),
          borderRadius: 6,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { top: 28 } },
        onClick: (evt, els) => {
          if (els.length > 0) drillRef.current?.({ action: Object.keys(byAction)[els[0].index], _ts: Date.now() });
        },
        plugins: {
          legend: { display: false },
          datalabels: { anchor: 'end', align: 'end', offset: 2, font: { size: 13, weight: 'bold' }, color: '#003366', formatter: v => v },
          tooltip: { callbacks: { label: i => ` ${i.raw} services — click to drill down` } },
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 11 } } },
          y: { display: false, suggestedMax: maxAction + 3 },
        }
      }
    });

    chart2.current = new Chart(chartRef2.current, {
      type: 'doughnut',
      data: {
        labels: Object.keys(byJourney),
        datasets: [{
          data: Object.values(byJourney),
          backgroundColor: Object.keys(byJourney).map(j => JOURNEY_C[j] || '#6a6d73'),
          borderWidth: 3, borderColor: '#fff', hoverOffset: 10,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        onClick: (evt, els) => {
          if (els.length > 0) drillRef.current?.({ journey: Object.keys(byJourney)[els[0].index], _ts: Date.now() });
        },
        plugins: {
          legend: {
            position: 'right',
            labels: {
              font: { size: 10 }, padding: 10,
              generateLabels: chart => {
                const d = chart.data;
                return d.labels.map((lbl, i) => {
                  const val = d.datasets[0].data[i];
                  const pct = total2 ? Math.round(val / total2 * 100) : 0;
                  return { text: `${lbl}  ${val} (${pct}%)`, fillStyle: d.datasets[0].backgroundColor[i], strokeStyle: '#fff', lineWidth: 2, index: i, hidden: !chart.getDataVisibility(i) };
                });
              }
            }
          },
          datalabels: {
            display: ctx => { const v = ctx.dataset.data[ctx.dataIndex], t = ctx.dataset.data.reduce((a,b)=>a+b,0); return t > 0 && v/t > 0.04; },
            formatter: (v, ctx) => { const t = ctx.dataset.data.reduce((a,b)=>a+b,0); return `${v}\n${t?Math.round(v/t*100):0}%`; },
            color: '#fff', font: { size: 10, weight: 'bold' }, textAlign: 'center',
          },
          tooltip: { callbacks: { label: i => { const p = total2 ? Math.round(i.raw/total2*100) : 0; return ` ${i.label}: ${i.raw} (${p}%) — click to drill down`; } } }
        }
      }
    });
    return () => {
      if (chart1.current) { chart1.current.destroy(); chart1.current = null; }
      if (chart2.current) { chart2.current.destroy(); chart2.current = null; }
    };
  }, [stats]);

  if (!stats) return <Loader />;
  const hint = <span className="drill-hint">↗ Click to filter Catalog</span>;
  return (
    <div>
      <div className="notice orange"><strong>⚠️ To-Be Portfolio:</strong> This portal reflects the <em>future state</em> per internal planning documents. New generic L2 SKUs go live <strong>1 Dec 2026</strong>. All non-generic SKUs retired by <strong>May 2027</strong>.</div>
      <div className="kpi-row">
        <div className="kpi" onClick={() => onDrillDown && onDrillDown({ statusContains: '', _ts: Date.now() })}>
          <div className="kl">Total Services</div><div className="kv">{stats.total}</div><div className="ks">Across 5 journeys ↗</div>
        </div>
        <div className="kpi g" onClick={() => onDrillDown && onDrillDown({ statusContains: 'Active', _ts: Date.now() })}>
          <div className="kl">🟢 Active</div><div className="kv">{stats.active}</div><div className="ks">Bookable today ↗</div>
        </div>
        <div className="kpi o" onClick={() => onDrillDown && onDrillDown({ statusContains: 'Coming', _ts: Date.now() })}>
          <div className="kl">🔵 Coming Dec 2026</div><div className="kv">{stats.coming}</div><div className="ks">New SKUs ↗</div>
        </div>
        <div className="kpi r" onClick={() => onDrillDown && onDrillDown({ statusContains: 'Retiring', _ts: Date.now() })}>
          <div className="kl">🔴 Retiring</div><div className="kv">{stats.retiring}</div><div className="ks">By Jan–May 2027 ↗</div>
        </div>
        <div className="kpi gd" onClick={() => onDrillDown && onDrillDown({ journey: 'DMLT Cross Services', _ts: Date.now() })}>
          <div className="kl">🗂️ DMLT Services</div><div className="kv">{(stats.byJourney && stats.byJourney['DMLT Cross Services']) || 0}</div><div className="ks">Cross-journey ↗</div>
        </div>
        <div className="kpi p">
          <div className="kl">Data Source</div>
          <div className="kv" style={{ fontSize: 16, paddingTop: 8 }}>{stats.source === 'mcp-live' ? '🟢 Live' : '🟡 Seed'}</div>
          <div className="ks">{stats.source}</div>
        </div>
      </div>
      <div className="ch-row">
        <div className="card">
          <div className="card-hdr">Services by Action Type {hint}</div>
          <div style={{ padding: 16 }}><div className="ch-inner"><canvas ref={chartRef1} /></div></div>
        </div>
        <div className="card">
          <div className="card-hdr">Services by Transformation Journey {hint}</div>
          <div style={{ padding: 16 }}><div className="ch-inner"><canvas ref={chartRef2} /></div></div>
        </div>
      </div>
      <div className="notice blue"><strong>Key Rules:</strong> (1) Advisory NOT standalone under PS. (2) SAC Planning → Finance &amp; Spend. (3) Data science stays in Data &amp; AI. (4) Enablement → Success Plans. (5) New generic SKUs replace all existing non-generic by May 2027.</div>
    </div>
  );
}

/* ─── Catalog ────────────────────────────────────────────────── */
function Catalog({ onSelect, drillFilter, onAdd, onEdit, reloadKey }) {
  const [rows, setRows]           = useState([]);
  const [total, setTotal]         = useState(0);
  const [filters, setFilters]     = useState({ journeys: [], statuses: [], actions: [] });
  const [q, setQ]                 = useState('');
  const [journey, setJourney]     = useState('');
  const [status, setStatus]       = useState('');
  const [action, setAction]       = useState('');
  const [fetching, setFetching]   = useState(false);
  const [err, setErr]             = useState('');
  const [page, setPage]           = useState(0);
  const [sortCol, setSortCol]     = useState('sku');
  const [sortDir, setSortDir]     = useState(1);
  const PER = 20;

  useEffect(() => {
    if (!drillFilter) return;
    if (drillFilter.q              !== undefined) { setQ(drillFilter.q);                  setJourney(''); setAction(''); setStatus(''); }
    if (drillFilter.action         !== undefined) { setAction(drillFilter.action);         setJourney(''); setQ(''); setStatus(''); }
    if (drillFilter.journey        !== undefined) { setJourney(drillFilter.journey);       setAction(''); setQ(''); setStatus(''); }
    if (drillFilter.statusContains !== undefined) { setStatus(drillFilter.statusContains); setAction(''); setQ(''); setJourney(''); }
  }, [drillFilter]);

  useEffect(() => { api.get('/filters').then(r => setFilters(r)).catch(() => {}); }, []);

  useEffect(() => {
    setFetching(true); setErr('');
    const p = new URLSearchParams();
    if (q)       p.set('q', q);
    if (journey) p.set('journey', journey);
    if (status)  p.set('status', status);
    if (action)  p.set('action', action);
    api.get(`/services?${p}`)
      .then(r => { setRows(r.data || []); setTotal(r.total || 0); setPage(0); })
      .catch(e => setErr(e.message))
      .finally(() => setFetching(false));
  }, [q, journey, status, action, reloadKey]);

  const sorted   = [...rows].sort((a, b) => sortDir * String(a[sortCol] || '').localeCompare(String(b[sortCol] || '')));
  const pageRows = sorted.slice(page * PER, (page + 1) * PER);
  const doSort   = col => { if (sortCol === col) setSortDir(d => -d); else { setSortCol(col); setSortDir(1); } };
  const arrow    = col => sortCol === col ? (sortDir === 1 ? ' ↑' : ' ↓') : '';
  const clearFilters = () => { setAction(''); setJourney(''); setStatus(''); setQ(''); };

  return (
    <div>
      <div className="card">
        <div className="ttoolbar">
          <input type="search" placeholder="🔍 Search SKU, name, scope…" value={q} onChange={e => setQ(e.target.value)} />
          <select value={journey} onChange={e => setJourney(e.target.value)}>
            <option value="">All Journeys</option>
            {filters.journeys && filters.journeys.map(j => <option key={j}>{j}</option>)}
          </select>
          <select value={status} onChange={e => setStatus(e.target.value)}>
            <option value="">All Statuses</option>
            {filters.statuses && filters.statuses.map(s => <option key={s}>{s}</option>)}
          </select>
          <select value={action} onChange={e => setAction(e.target.value)}>
            <option value="">All Actions</option>
            {filters.actions && filters.actions.map(a => <option key={a}>{a}</option>)}
          </select>
          {(action || journey || status || q) && (
            <span style={{ fontSize: 11, background: '#e8f4fc', color: 'var(--blue)', border: '1px solid #0070b155', borderRadius: 4, padding: '3px 8px', display: 'flex', alignItems: 'center', gap: 5 }}>
              🔍 {q ? `"${q}"` : (action || journey || status)}
              <button onClick={clearFilters} style={{ border: 'none', background: 'none', cursor: 'pointer', color: 'var(--red)', fontWeight: 700, fontSize: 13, lineHeight: 1 }}>✕</button>
            </span>
          )}
          <button onClick={onAdd}
            style={{ marginLeft: 'auto', padding: '7px 16px', background: 'var(--green)', color: '#fff', border: 'none', borderRadius: 20, fontWeight: 700, fontSize: 12, cursor: 'pointer', boxShadow: '0 2px 6px rgba(16,126,62,.3)' }}>
            ➕ Add Service
          </button>
          <span style={{ fontSize: 11, color: 'var(--muted)', fontWeight: 600 }}>{total} services</span>
        </div>
        {err && <div style={{ padding: '10px 16px' }}><ErrState message={err} /></div>}
        <div style={{ overflowX: 'auto', opacity: fetching ? 0.5 : 1, transition: 'opacity .2s' }}>
          <table>
            <thead>
              <tr>
                {['sku','name','journey','status','action'].map(c => (
                  <th key={c} onClick={() => doSort(c)}>{c.charAt(0).toUpperCase()+c.slice(1)}{arrow(c)}</th>
                ))}
                <th>Sizes</th><th>Scope</th><th style={{ width: 44 }}></th>
              </tr>
            </thead>
            <tbody>
              {fetching && rows.length === 0 && (
                <tr><td colSpan={8} style={{ textAlign: 'center', color: 'var(--muted)', padding: 36 }}>⟳ Loading…</td></tr>
              )}
              {!fetching && pageRows.length === 0 && (
                <tr><td colSpan={8} style={{ textAlign: 'center', color: 'var(--muted)', padding: 36, fontStyle: 'italic' }}>No services match your filters.</td></tr>
              )}
              {pageRows.map(s => (
                <tr key={s.sku} className={`row-${(s.action || '').toLowerCase()}`} onClick={() => onSelect(s)}>
                  <td><a href={`${CAT}${s.sku}`} target="_blank" rel="noreferrer" className="sku-link" onClick={e => e.stopPropagation()}>#{s.sku}</a></td>
                  <td style={{ fontWeight: 600, color: '#003366', maxWidth: 230, lineHeight: 1.4 }}>
                    {s.name}
                    {s._manual && <span className="manual-badge">MANUAL</span>}
                  </td>
                  <td>
                    <span className="pill" style={{ background: (JOURNEY_C[s.journey]||'#6a6d73')+'22', color: JOURNEY_C[s.journey]||'#6a6d73', border: `1px solid ${JOURNEY_C[s.journey]||'#6a6d73'}55`, boxShadow: 'none' }}>
                      {s.journey}
                    </span>
                  </td>
                  <td><Pill text={s.status} colorMap={STATUS_C} /></td>
                  <td><Pill text={s.action} colorMap={ACTION_C} /></td>
                  <td style={{ fontSize: 11 }}>{s.sizes && s.sizes.length ? s.sizes.join(', ') : '—'}</td>
                  <td style={{ maxWidth: 260, fontSize: 11, color: 'var(--muted)', lineHeight: 1.4 }}>{(s.scope || '').substring(0, 110)}{s.scope && s.scope.length > 110 ? '…' : ''}</td>
                  <td onClick={e => e.stopPropagation()}>
                    <button title="Edit"
                      onClick={e => { e.stopPropagation(); onEdit && onEdit(s); }}
                      style={{ background: 'none', border: '1px solid var(--border)', borderRadius: 4, cursor: 'pointer', padding: '3px 7px', fontSize: 12, color: 'var(--blue)', transition: 'all .15s' }}
                      onMouseOver={e => e.currentTarget.style.background = '#e8f4fc'}
                      onMouseOut={e => e.currentTarget.style.background = 'none'}>
                      ✏️
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="pager">
          <span>Showing {total === 0 ? 0 : Math.min(page*PER+1,rows.length)}–{Math.min((page+1)*PER,rows.length)} of {total}</span>
          <div style={{ display: 'flex', gap: 6 }}>
            <button className="pbtn" disabled={page === 0} onClick={() => setPage(p => p-1)}>← Prev</button>
            <button className="pbtn" disabled={(page+1)*PER >= rows.length} onClick={() => setPage(p => p+1)}>Next →</button>
          </div>
        </div>
      </div>
    </div>
  );
}

      {groups.map(g => (
        <div key={g.title} className="card" style={{ marginBottom: 16 }}>
          <div className="card-hdr">{g.title}</div>
          <div style={{ padding: '4px 16px 12px' }}>
            {g.skus.map(sku => {
              const s = svcs.find(x => x.sku === sku);
              if (!s) return null;
              return (
                <div key={sku} className="dmlt-item" onClick={() => onSelect(s)}>
                  <div style={{ flexShrink: 0, paddingTop: 2 }}>
                    <a href={`${CAT}${sku}`} target="_blank" rel="noreferrer" className="sku-link" onClick={e => e.stopPropagation()}>#{sku}</a>
                  </div>
                  <div style={{ flex: 1 }}>
                    <div className="dmlt-name">{s.name}</div>
                    <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 2, lineHeight: 1.4 }}>{s.scope && s.scope.substring(0,140)}{s.scope && s.scope.length > 140 ? '…' : ''}</div>
                    {s.notes && <div className="dmlt-note">📌 {s.notes.substring(0,100)}{s.notes.length>100?'…':''}</div>}
                  </div>
                  <Pill text={s.action} colorMap={ACTION_C} />
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ─── Retiring tab ───────────────────────────────────────────── */
function RetiringTab({ onSelect }) {
  const [retiring, setRetiring] = useState([]);
  const [coming, setComing]     = useState([]);
  const [err, setErr] = useState('');
  useEffect(() => {
    api.get('/services?limit=500')
      .then(r => {
        setRetiring((r.data || []).filter(s => s.status.includes('Retiring')));
        setComing((r.data || []).filter(s => s.status.includes('Coming')));
      })
      .catch(e => setErr(e.message));
  }, []);
  if (err) return <ErrState message={err} />;
  return (
    <div>
      <div className="notice red"><strong>🔴 Retirement Schedule:</strong> Non-generic SKUs hidden from new deals <strong>4 Jan 2027</strong> and fully retired by <strong>May 2027 (2705 release)</strong>. Open deals may continue.</div>
      {retiring.map(s => (
        <div key={s.sku} className="retire-card" style={{ borderLeft: '4px solid #bb0000' }} onClick={() => onSelect(s)}>
          <div style={{ padding: '13px 18px', display: 'flex', gap: 14, alignItems: 'flex-start' }}>
            <div style={{ flex: 1 }}>
              <a href={`${CAT}${s.sku}`} target="_blank" rel="noreferrer" className="sku-link" onClick={e => e.stopPropagation()}>#{s.sku}</a>
              <div style={{ fontWeight: 700, color: '#003366', fontSize: 13, marginTop: 4 }}>{s.name}</div>
              <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 3, lineHeight: 1.5 }}>{s.notes}</div>
            </div>
            <Pill text={s.status} colorMap={STATUS_C} />
          </div>
        </div>
      ))}
      <div style={{ fontWeight: 700, color: '#003366', fontSize: 14, margin: '22px 0 12px', paddingBottom: 8, borderBottom: '2px solid var(--blue)' }}>Coming Soon</div>
      <div className="notice blue"><strong>New generic L2 SKUs</strong> go live 1 Dec 2026, replacing current non-generic SKUs.</div>
      {coming.map(s => (
        <div key={s.sku} className="retire-card" style={{ borderLeft: `4px solid ${STATUS_C[s.status] || '#0070b1'}` }} onClick={() => onSelect(s)}>
          <div style={{ padding: '13px 18px' }}>
            <a href={`${CAT}${s.sku}`} target="_blank" rel="noreferrer" className="sku-link" onClick={e => e.stopPropagation()}>#{s.sku}</a>
            <div style={{ fontWeight: 700, color: '#003366', fontSize: 13, marginTop: 4 }}>{s.name}</div>
            <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 3, lineHeight: 1.5, marginBottom: 6 }}>{s.scope}</div>
            <Pill text={s.status} colorMap={STATUS_C} />
          </div>
        </div>
      ))}
    </div>
  );
}

/* ─── Rules tab ──────────────────────────────────────────────── */
function RulesTab() {
  const [rules, setRules] = useState([]);
  const [err, setErr] = useState('');
  useEffect(() => { api.get('/rules').then(r => setRules(r.data || [])).catch(e => setErr(e.message)); }, []);
  if (err) return <ErrState message={err} />;
  if (!rules.length) return <Loader />;
  return (
    <div>
      <div className="notice green">These rules apply when scoping, positioning, or selling Data &amp; AI Professional Services. Sourced from internal To-Be portfolio planning documents.</div>
      <div className="rule-grid">
        {rules.map(r => (
          <div key={r.id} className="rule-card">
            <h4>{r.icon} {r.title}</h4>
            <div className="rule-body">{r.body}</div>
            <div className="rule-impact"><strong>Impact:</strong> {r.impact}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ─── ServiceForm ────────────────────────────────────────────── */
const EMPTY_SVC = { sku: '', name: '', journey: 'New Implementation', status: 'Active', action: 'ACTIVE', sizes: '', owner: '', scope: '', notes: '' };
const JOURNEY_OPTS = ['New Implementation','System Conversion','Expansion & Tuning','DMLT Cross Services','System Migration / PEX','Retiring','Uncategorised'];
const STATUS_OPTS  = ['Active','Active / TBD','Coming Dec 2026','Coming 2705','Active — Merging','Active — Transferring to Finance','Retiring Jan 2027','Retiring (Obsolete)','Retiring — Moving to Success Plans','Retiring'];
const ACTION_OPTS  = ['NEW','UPDATE','MERGE','SPLIT','RETIRE','ACTIVE','TRANSFER'];

function ServiceForm({ svc, onClose, onSaved }) {
  const isEdit = !!(svc && svc.sku);
  const [form, setForm] = useState(() => isEdit
    ? { ...svc, sizes: Array.isArray(svc.sizes) ? svc.sizes.join(', ') : (svc.sizes || '') }
    : { ...EMPTY_SVC });
  const [saving, setSaving] = useState(false);
  const [err, setErr]       = useState('');
  const toast   = useToast();
  const confirm = useConfirm();

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const submit = async () => {
    if (!form.sku.trim())  return setErr('SKU is required.');
    if (!form.name.trim()) return setErr('Service name is required.');
    setSaving(true); setErr('');
    const payload = { ...form, sizes: form.sizes.split(',').map(s => s.trim()).filter(Boolean) };
    const j = isEdit
      ? await api.put(`/services/${encodeURIComponent(form.sku)}`, payload).catch(e => ({ ok: false, error: e.message }))
      : await api.post('/services', payload).catch(e => ({ ok: false, error: e.message }));
    setSaving(false);
    if (!j.ok) return setErr(j.error || 'Save failed.');
    toast.success(isEdit ? `Service #${form.sku} updated.` : `Service #${form.sku} added successfully.`);
    onSaved();
    onClose();
  };

  const doDelete = async () => {
    const msg = svc && svc._manual
      ? `Permanently delete service #${form.sku}? This cannot be undone.`
      : `Hide service #${form.sku} from the catalog? The seed record stays on disk but won't appear in the portal. You can restore it by editing manual-services.json.`;
    const ok = await confirm(msg);
    if (!ok) return;
    const j = await api.del(`/services/${encodeURIComponent(form.sku)}`).catch(e => ({ ok: false, error: e.message }));
    if (!j.ok) return setErr(j.error || 'Delete failed.');
    toast.success(`Service #${form.sku} ${svc && svc._manual ? 'deleted' : 'hidden from catalog'}.`);
    onSaved();
    onClose();
  };

  return (
    <div className="sform-ov show" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="sform">
        <div className="sform-hdr">
          <div>
            <div style={{ fontSize: 11, opacity: .68, marginBottom: 3 }}>{isEdit ? `Editing SKU #${form.sku}` : 'New Service Entry'}</div>
            <div style={{ fontSize: 15, fontWeight: 700 }}>{isEdit ? 'Edit Service' : 'Add Service Manually'}</div>
          </div>
          <button className="mhdr-close" onClick={onClose}>✕</button>
        </div>
        <div className="sform-body">
          <div>
            <label>SKU *</label>
            <input value={form.sku} onChange={e => set('sku', e.target.value)} disabled={isEdit} placeholder="e.g. 50112345" />
          </div>
          <div>
            <label>Owner</label>
            <input value={form.owner} onChange={e => set('owner', e.target.value)} placeholder="Service owner name" />
          </div>
          <div className="full">
            <label>Name *</label>
            <input value={form.name} onChange={e => set('name', e.target.value)} placeholder="Full service name" />
          </div>
          <div>
            <label>Journey</label>
            <select value={form.journey} onChange={e => set('journey', e.target.value)}>
              {JOURNEY_OPTS.map(j => <option key={j}>{j}</option>)}
            </select>
          </div>
          <div>
            <label>Status</label>
            <select value={form.status} onChange={e => set('status', e.target.value)}>
              {STATUS_OPTS.map(s => <option key={s}>{s}</option>)}
            </select>
          </div>
          <div>
            <label>Action</label>
            <select value={form.action} onChange={e => set('action', e.target.value)}>
              {ACTION_OPTS.map(a => <option key={a}>{a}</option>)}
            </select>
          </div>
          <div>
            <label>T-shirt Sizes <span style={{ fontWeight: 400, textTransform: 'none', fontSize: 9 }}>(comma-separated)</span></label>
            <input value={form.sizes} onChange={e => set('sizes', e.target.value)} placeholder="XS, S, M, L, XL" />
          </div>
          <div className="full">
            <label>Scope</label>
            <textarea value={form.scope} onChange={e => set('scope', e.target.value)} placeholder="Describe what this service covers…" />
          </div>
          <div className="full">
            <label>Notes / Planning Status</label>
            <textarea value={form.notes} onChange={e => set('notes', e.target.value)} placeholder="Planning decisions, dependencies, open items…" />
          </div>
          {err && <div className="sform-err full">⚠️ {err}</div>}
        </div>
        <div className="sform-foot">
          {isEdit && (
            <button className="sbtn danger" onClick={doDelete} style={{ marginRight: 'auto' }}
              title={svc && svc._manual ? 'Permanently remove this service' : 'Hide from catalog (seed data preserved)'}>
              🗑 {svc && svc._manual ? 'Delete' : 'Hide'}
            </button>
          )}
          <button className="sbtn ghost" onClick={onClose}>Cancel</button>
          <button className="sbtn primary" onClick={submit} disabled={saving}>
            {saving ? 'Saving…' : (isEdit ? '💾 Save Changes' : '➕ Add Service')}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ─── App ────────────────────────────────────────────────────── */
function App() {
  const [tab,         setTab]         = useState('overview');
  const [selected,    setSelected]    = useState(null);
  const [stats,       setStats]       = useState(null);
  const [statsErr,    setStatsErr]    = useState('');
  const [loading,     setLoading]     = useState(false);
  const [drillFilter, setDrillFilter] = useState(null);
  const [navQ,        setNavQ]        = useState('');
  const [formSvc,     setFormSvc]     = useState(null);
  const [reloadKey,   setReloadKey]   = useState(0);

  const loadStats = useCallback(() => {
    return api.get('/stats')
      .then(r => { setStats(r.data); setStatsErr(''); })
      .catch(e => setStatsErr(e.message));
  }, []);

  useEffect(() => { loadStats(); }, []);

  const handleDrillDown = useCallback(filter => {
    setDrillFilter({ ...filter, _ts: Date.now() });
    setTab('catalog');
  }, []);

  const doNavSearch = useCallback(val => {
    const q = val !== undefined ? val : navQ;
    if (!q.trim()) return;
    setDrillFilter({ q: q.trim(), _ts: Date.now() });
    setTab('catalog');
  }, [navQ]);

  const doRefresh = async () => {
    setLoading(true);
    const r = await api.post('/refresh').catch(e => ({ ok: false, error: e.message }));
    await loadStats();
    setLoading(false);
    return r;
  };

  const onSaved = useCallback(() => {
    loadStats();
    setReloadKey(k => k + 1);
  }, [loadStats]);

  const tabs = [
    { id: 'overview', label: '📊 Overview' },
    { id: 'journey',  label: '🗺️ Journey' },
    { id: 'catalog',  label: `📋 Catalog (${stats ? stats.total : '…'})` },
    { id: 'dmlt',     label: '🗂️ DMLT' },
    { id: 'retiring', label: `🔴 Retiring (${stats ? stats.retiring : '…'})` },
    { id: 'rules',    label: '📜 Rules' },
  ];

  return (
    <>
      <header className="hdr">
        <div style={{ display: 'flex', alignItems: 'center' }}>
          <div className="logo">SAP</div>
          <div>
            <div className="hdr-title">Data &amp; AI PS Portfolio</div>
            <div className="hdr-sub">To-Be · Professional Services · Oct 2026</div>
          </div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          <div style={{ textAlign: 'right', fontSize: 11, opacity: .75 }}>
            {stats ? stats.total : '–'} services total
          </div>
          <div className="hdr-badge">
            <span className="hdr-dot" style={{ color: stats && stats.source === 'mcp-live' ? '#4caf50' : '#f0ab00', background: stats && stats.source === 'mcp-live' ? '#4caf50' : '#f0ab00' }}></span>
            {stats && stats.source === 'mcp-live' ? 'Live MCP' : 'Document Seed'}
          </div>
        </div>
      </header>

      <nav className="nav">
        <div className="nav-tabs">
          {tabs.map(t => (
            <button key={t.id} className={`nbtn${tab === t.id ? ' on' : ''}`} onClick={() => setTab(t.id)}>{t.label}</button>
          ))}
        </div>
        <div className="nav-search">
          <input type="search" placeholder="🔍 Search services…" value={navQ}
            onChange={e => setNavQ(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && doNavSearch()} />
          <button onClick={() => doNavSearch()}>Search</button>
        </div>
      </nav>

      <div className="main">
        {statsErr && <div className="notice red">⚠️ Could not load stats: {statsErr} — <button onClick={loadStats} style={{ background: 'none', border: 'none', cursor: 'pointer', textDecoration: 'underline', color: 'inherit', fontSize: 12 }}>retry</button></div>}
        <RefreshBar meta={stats} onRefresh={doRefresh} loading={loading} />
        {tab === 'overview' && <Overview stats={stats} onDrillDown={handleDrillDown} />}
        {tab === 'journey'  && <Journey  onSelect={setSelected} />}
        {tab === 'catalog'  && <Catalog  onSelect={setSelected} drillFilter={drillFilter} onAdd={() => setFormSvc({})} onEdit={s => setFormSvc(s)} reloadKey={reloadKey} />}
        {tab === 'dmlt'     && <DMLTTab  onSelect={setSelected} />}
        {tab === 'retiring' && <RetiringTab onSelect={setSelected} />}
        {tab === 'rules'    && <RulesTab />}
      </div>

      <Modal svc={selected} onClose={() => setSelected(null)} onEdit={s => { setSelected(null); setFormSvc(s); }} />
      {formSvc !== null && (
        <ServiceForm
          svc={Object.keys(formSvc).length === 0 ? null : formSvc}
          onClose={() => setFormSvc(null)}
          onSaved={onSaved}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ToastProvider>
    <ConfirmProvider>
      <App />
    </ConfirmProvider>
  </ToastProvider>
);
</script>
</body>
</html>
