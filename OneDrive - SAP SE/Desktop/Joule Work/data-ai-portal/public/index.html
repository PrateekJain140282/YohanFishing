<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SAP Data &amp; AI PS Portal</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#0070b1;--dark:#003366;--gold:#f0ab00;--green:#107e3e;--orange:#e9730c;--red:#bb0000;--purple:#7b5ea7;--bg:#f0f2f5;--card:#fff;--text:#32363a;--muted:#6a6d73;--border:#d9dadb;--shadow:0 1px 4px rgba(0,0,0,.10)}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
.hdr{background:linear-gradient(135deg,#001f3f,var(--dark),var(--blue));color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:300;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.logo{width:38px;height:38px;background:var(--gold);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#fff;margin-right:12px;flex-shrink:0}
.nav{background:#fff;border-bottom:2px solid var(--border);display:flex;padding:0 16px;position:sticky;top:64px;z-index:200;gap:2px;align-items:center}
.nav-tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0}
.nav-search{display:flex;align-items:center;gap:6px;padding:6px 0 6px 12px;flex-shrink:0;border-left:1px solid var(--border);margin-left:8px}
.nav-search input{padding:6px 10px;border:1px solid var(--border);border-radius:20px;font-size:12px;outline:none;width:210px;background:#f8f9fb}
.nav-search input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 2px #0070b122}
.nav-search button{padding:6px 14px;background:var(--blue);color:#fff;border:none;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.nav-search button:hover{background:var(--dark)}
.nbtn{padding:12px 14px;border:none;background:none;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s}
.nbtn.on,.nbtn:hover{color:var(--blue);border-bottom-color:var(--blue)}
.main{max-width:1500px;margin:0 auto;padding:20px}
/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--card);border-radius:8px;padding:16px;box-shadow:var(--shadow);border-left:4px solid var(--blue);cursor:pointer;transition:transform .15s,box-shadow .15s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.14)}
.kpi.g{border-left-color:var(--green);background:linear-gradient(135deg,#fff,#f0faf4)}.kpi.o{border-left-color:var(--orange);background:linear-gradient(135deg,#fff,#fdf3ec)}.kpi.r{border-left-color:var(--red);background:linear-gradient(135deg,#fff,#fdf0f0)}.kpi.p{border-left-color:var(--purple);background:linear-gradient(135deg,#fff,#f5f0fa)}.kpi.gd{border-left-color:var(--gold);background:linear-gradient(135deg,#fff,#fdfaec)}
.kl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-bottom:4px}
.kv{font-size:30px;font-weight:800;color:var(--dark);line-height:1}
.ks{font-size:11px;color:var(--muted);margin-top:3px}
/* Cards */
.card{background:var(--card);border-radius:8px;box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.card-hdr{padding:12px 16px;font-size:13px;font-weight:700;color:var(--dark);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
/* Journey Kanban */
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
@media(max-width:1100px){.kanban{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.kanban{grid-template-columns:1fr}}
.kol-head{padding:9px 12px;border-radius:8px 8px 0 0;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px}
.kol-body{background:#f8f9fb;border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;padding:8px;min-height:180px;display:flex;flex-direction:column;gap:6px}
.svc{background:#fff;border-radius:5px;padding:9px 10px;border:1px solid var(--border);cursor:pointer;transition:box-shadow .15s,transform .15s}
.svc:hover{box-shadow:0 3px 10px rgba(0,0,0,.15);transform:translateY(-1px)}
/* Table */
.ttoolbar{padding:10px 14px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--border)}
input[type=search],select{padding:6px 10px;border:1px solid var(--border);border-radius:4px;font-size:12px;outline:none;background:#fff}
input[type=search]{width:180px}
input[type=search]:focus,select:focus{border-color:var(--blue)}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--dark)}
th{padding:9px 12px;text-align:left;font-size:10px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;white-space:nowrap;user-select:none}
th:hover{background:var(--blue)}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
tbody tr:hover{background:#e8f4fc}
td{padding:9px 12px;font-size:12px;vertical-align:middle}
.pager{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);border-top:1px solid var(--border)}
.pbtn{padding:5px 10px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;font-size:11px}
.pbtn:hover{background:#e8f4fc}.pbtn:disabled{opacity:.4;cursor:not-allowed}
/* Pills */
.pill{display:inline-block;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap;letter-spacing:.3px}
/* Action type color strips on table rows */
.row-new{border-left:4px solid #0070b1!important}.row-update{border-left:4px solid #107e3e!important}
.row-merge{border-left:4px solid #e9730c!important}.row-split{border-left:4px solid #7b5ea7!important}
.row-retire{border-left:4px solid #bb0000!important}.row-active{border-left:4px solid #6a6d73!important}
.row-transfer{border-left:4px solid #f0ab00!important}
/* Modal */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center}
.ov.show{display:flex}
.modal{background:#fff;border-radius:10px;width:min(680px,94vw);max-height:88vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.3)}
.mhdr{padding:16px 20px;background:var(--dark);color:#fff;border-radius:10px 10px 0 0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.mbody{padding:20px}
.mfield{margin-bottom:12px}
.mfield label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;display:block;margin-bottom:3px}
.mfield .val{font-size:13px;color:var(--text);line-height:1.6;background:#f8f9fb;padding:8px 12px;border-radius:4px}
/* Charts row */
.ch-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
@media(max-width:800px){.ch-row{grid-template-columns:1fr}}
.ch-inner{position:relative;height:220px}
.ch-inner canvas{cursor:pointer}
.drill-hint{font-size:10px;color:#6a6d73;font-style:italic;font-weight:400;margin-left:8px}
/* Notice */
.notice{padding:12px 16px;border-radius:6px;font-size:12px;margin-bottom:16px}
.notice.blue{background:#e8f4fc;border-left:4px solid var(--blue);color:#004a77}
.notice.orange{background:#fce8d5;border-left:4px solid var(--orange);color:#7a3500}
.notice.red{background:#f4d4d4;border-left:4px solid var(--red);color:#7a0000}
.notice.green{background:#d8f0e4;border-left:4px solid var(--green);color:#054a1e}
/* Refresh bar */
.rbar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card);border-radius:8px;box-shadow:var(--shadow);margin-bottom:18px;flex-wrap:wrap}
.rbtn{padding:7px 16px;background:var(--blue);color:#fff;border:none;border-radius:5px;font-size:12px;font-weight:700;cursor:pointer}
.rbtn:hover{background:var(--dark)}.rbtn:disabled{opacity:.5;cursor:not-allowed}
.rsrc{font-size:11px;padding:2px 8px;border-radius:8px;font-weight:700}
.rsrc.live{background:#d8f0e4;color:var(--green)}
.rsrc.seed{background:#fce8d5;color:var(--orange)}
/* Loader */
.loader{text-align:center;padding:40px;color:var(--muted);font-size:13px}
/* Rule cards */
.rule-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.rule-card{background:var(--card);border-radius:8px;padding:16px;box-shadow:var(--shadow);border-left:4px solid var(--blue)}
.rule-card h4{font-size:13px;font-weight:700;color:var(--dark);margin-bottom:6px}
.rule-body{font-size:12px;color:var(--text);margin-bottom:8px;line-height:1.6}
.rule-impact{font-size:11px;color:var(--muted);background:#f8f9fb;border-radius:4px;padding:6px 10px;border-left:3px solid var(--gold)}
/* SKU link */
.sku-link{color:var(--blue);font-weight:700;text-decoration:none;background:#e8f4fc;padding:2px 6px;border-radius:4px;font-size:11px}
.sku-link:hover{text-decoration:underline}
/* Service form */
.sform-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:600;align-items:center;justify-content:center}
.sform-ov.show{display:flex}
.sform{background:#fff;border-radius:10px;width:min(700px,95vw);max-height:92vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.35)}
.sform-hdr{padding:16px 20px;background:var(--dark);color:#fff;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:space-between}
.sform-body{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sform-body .full{grid-column:1/-1}
.sform label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:3px}
.sform input,.sform select,.sform textarea{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:4px;font-size:12px;font-family:inherit;outline:none}
.sform input:focus,.sform select:focus,.sform textarea:focus{border-color:var(--blue)}
.sform textarea{min-height:70px;resize:vertical}
.sform-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.sbtn{padding:7px 18px;border-radius:5px;font-size:12px;font-weight:700;cursor:pointer;border:none}
.sbtn.primary{background:var(--blue);color:#fff}.sbtn.primary:hover{background:var(--dark)}
.sbtn.ghost{background:#f0f0f0;color:var(--text)}.sbtn.ghost:hover{background:#e0e0e0}
.sbtn.danger{background:var(--red);color:#fff}
.manual-badge{font-size:9px;font-weight:700;background:#e8f4fc;color:#0070b1;border:1px solid #0070b166;border-radius:4px;padding:1px 5px;vertical-align:middle;margin-left:4px}
/* DMLT items */
.dmlt-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f0;cursor:pointer}
.dmlt-item:last-child{border-bottom:none}
.dmlt-item:hover .dmlt-name{color:var(--blue)}
.dmlt-name{font-size:12px;font-weight:600;color:var(--dark);line-height:1.4}
.dmlt-note{font-size:10px;color:var(--orange);margin-top:2px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;
Chart.register(ChartDataLabels);

// ─── Constants ───────────────────────────────────────────────────────────────
const CAT = 'https://servicescatalog.cvdp3eof-dbsservic1-p1-public.model-t.cc.commerce.ondemand.com/p/';
const STATUS_C = {
  'Active':'#107e3e','Active / TBD':'#5a8a00','Coming Dec 2026':'#0070b1',
  'Coming 2705':'#7b5ea7','Active — Merging':'#e9730c','Active — Transferring to Finance':'#f0ab00',
  'Retiring Jan 2027':'#bb0000','Retiring (Obsolete)':'#bb0000',
  'Retiring — Moving to Success Plans':'#bb0000','Retiring':'#bb0000',
};
const ACTION_C = {
  'NEW':'#0070b1','UPDATE':'#107e3e','MERGE':'#e9730c','SPLIT':'#7b5ea7',
  'RETIRE':'#bb0000','ACTIVE':'#6a6d73','TRANSFER':'#f0ab00',
};
const JOURNEY_C = {
  'New Implementation':'#0070b1','System Conversion':'#7b5ea7',
  'Expansion & Tuning':'#107e3e','DMLT Cross Services':'#e9730c',
  'System Migration / PEX':'#f0ab00','Retiring':'#bb0000','Uncategorised':'#6a6d73',
};
const JOURNEY_ICONS = {
  'New Implementation':'🆕','System Conversion':'🔄','Expansion & Tuning':'⚙️',
  'DMLT Cross Services':'🗂️','System Migration / PEX':'🚚','Retiring':'🔴',
};
const JOURNEYS = ['New Implementation','System Conversion','Expansion & Tuning','DMLT Cross Services','System Migration / PEX'];

// ─── API helpers ─────────────────────────────────────────────────────────────
const api = {
  get:  (path) => fetch(`/api${path}`).then(r => r.json()),
  post: (path) => fetch(`/api${path}`,{method:'POST'}).then(r => r.json()),
};

// ─── Pill component ───────────────────────────────────────────────────────────
function Pill({text, colorMap}) {
  const c = colorMap[text] || '#6a6d73';
  return (
    <span className="pill" style={{
      background: c,
      color: '#fff',
      boxShadow: `inset 0 -1px 0 rgba(0,0,0,.2)`,
    }}>{text}</span>
  );
}

// ─── Modal ────────────────────────────────────────────────────────────────────
function Modal({svc, onClose, onEdit}) {
  if (!svc) return null;
  return (
    <div className={`ov ${svc ? 'show' : ''}`} onClick={e => e.target.className.includes('ov') && onClose()}>
      <div className="modal">
        <div className="mhdr">
          <div>
            <div style={{fontSize:11,opacity:.75,marginBottom:2}}>
              #{svc.sku}
              {svc._manual && <span className="manual-badge" style={{marginLeft:6}}>MANUAL</span>}
            </div>
            <div style={{fontSize:15,fontWeight:700}}>{svc.name}</div>
          </div>
          <div style={{display:'flex',gap:6,alignItems:'center'}}>
            {onEdit && <button onClick={()=>onEdit(svc)} style={{background:'rgba(255,255,255,.2)',border:'none',color:'#fff',fontSize:12,cursor:'pointer',borderRadius:4,padding:'4px 10px',fontWeight:700}}>✏️ Edit</button>}
            <button onClick={onClose} style={{background:'rgba(255,255,255,.2)',border:'none',color:'#fff',fontSize:18,cursor:'pointer',borderRadius:4,width:28,height:28}}>✕</button>
          </div>
        </div>
        <div className="mbody">
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:14}}>
            <Pill text={svc.status} colorMap={STATUS_C}/>
            <Pill text={svc.action} colorMap={ACTION_C}/>
            {svc.sizes&&svc.sizes.length>0 && svc.sizes.map(s=>(
              <span key={s} className="pill" style={{background:'#f0f0f0',color:'#333',border:'1px solid #ccc'}}>{s}</span>
            ))}
          </div>
          <div className="mfield"><label>Journey</label><div className="val">{svc.journey}</div></div>
          <div className="mfield"><label>Scope</label><div className="val">{svc.scope||'—'}</div></div>
          <div className="mfield"><label>Notes / Planning Status</label><div className="val">{svc.notes||'—'}</div></div>
          {svc.owner && svc.owner !== 'N/A' && svc.owner !== 'Portfolio Team' &&
            <div className="mfield"><label>Service Owner</label><div className="val">👤 {svc.owner}</div></div>}
          <div style={{marginTop:16}}>
            <a href={`${CAT}${svc.sku}`} target="_blank" rel="noreferrer"
               style={{display:'inline-flex',alignItems:'center',gap:6,background:'#0070b1',color:'#fff',padding:'7px 14px',borderRadius:5,fontSize:12,fontWeight:700,textDecoration:'none'}}>
              🔗 Open in SAP Services Catalog
            </a>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── RefreshBar ───────────────────────────────────────────────────────────────
function RefreshBar({meta, onRefresh, loading}) {
  const [msg, setMsg] = useState('');
  const doRefresh = async () => {
    setMsg('Refreshing from MCP…');
    const r = await onRefresh();
    setMsg(r.message || 'Done.');
    setTimeout(() => setMsg(''), 5000);
  };
  if (!meta) return null;
  const isLive = meta.source === 'mcp-live';
  return (
    <div className="rbar">
      <button className="rbtn" onClick={doRefresh} disabled={loading}>
        {loading ? '⟳ Refreshing…' : '⟳ Refresh from MCP'}
      </button>
      <span className={`rsrc ${isLive?'live':'seed'}`}>
        {isLive ? '● Live (MCP)' : '● Seed data (document)'}
      </span>
      <span style={{fontSize:11,color:'#6a6d73'}}>
        Last refreshed: {meta.lastRefresh ? new Date(meta.lastRefresh).toLocaleString() : '—'}
      </span>
      {msg && <span style={{fontSize:11,color:'#0070b1',fontWeight:600}}>{msg}</span>}
    </div>
  );
}

// ─── Overview Tab ────────────────────────────────────────────────────────────
function Overview({stats, onDrillDown}) {
  const chartRef1 = useRef(null), chartRef2 = useRef(null);
  const chart1 = useRef(null), chart2 = useRef(null);

  useEffect(() => {
    if (!stats) return;
    const byAction  = stats.byAction  || {};
    const byJourney = stats.byJourney || {};
    const maxAction = Math.max(...Object.values(byAction), 1);
    const total2    = Object.values(byJourney).reduce((a,b)=>a+b,0);

    if (chart1.current) chart1.current.destroy();
    if (chart2.current) chart2.current.destroy();

    chart1.current = new Chart(chartRef1.current, {
      type:'bar',
      data:{
        labels:Object.keys(byAction),
        datasets:[{
          data:Object.values(byAction),
          backgroundColor:Object.keys(byAction).map(a=>ACTION_C[a]||'#6a6d73'),
          hoverBackgroundColor:Object.keys(byAction).map(a=>(ACTION_C[a]||'#6a6d73')+'bb'),
          borderRadius:4,
        }]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        layout:{padding:{top:24}},
        onClick:(evt,elements)=>{
          if(elements.length>0 && onDrillDown){
            const action=Object.keys(byAction)[elements[0].index];
            onDrillDown({action,_ts:Date.now()});
          }
        },
        plugins:{
          legend:{display:false},
          datalabels:{
            anchor:'end',
            align:'end',
            offset:2,
            font:{size:12,weight:'bold'},
            color:'#003366',
            formatter:v=>v,
          },
          tooltip:{
            callbacks:{
              label:item=>` ${item.raw} services — click to drill down`,
            }
          }
        },
        scales:{
          x:{grid:{display:false},ticks:{font:{size:11}}},
          y:{display:false,suggestedMax:maxAction+3}
        }
      }
    });

    chart2.current = new Chart(chartRef2.current, {
      type:'doughnut',
      data:{
        labels:Object.keys(byJourney),
        datasets:[{
          data:Object.values(byJourney),
          backgroundColor:Object.keys(byJourney).map(j=>JOURNEY_C[j]||'#6a6d73'),
          borderWidth:2,
          borderColor:'#fff',
          hoverOffset:8,
        }]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        onClick:(evt,elements)=>{
          if(elements.length>0 && onDrillDown){
            const journey=Object.keys(byJourney)[elements[0].index];
            onDrillDown({journey,_ts:Date.now()});
          }
        },
        plugins:{
          legend:{
            position:'right',
            labels:{
              font:{size:10},
              padding:10,
              generateLabels:(chart)=>{
                const d=chart.data;
                return d.labels.map((lbl,i)=>{
                  const val=d.datasets[0].data[i];
                  const pct=total2?Math.round(val/total2*100):0;
                  return {
                    text:`${lbl}  ${val} (${pct}%)`,
                    fillStyle:d.datasets[0].backgroundColor[i],
                    strokeStyle:'#fff',lineWidth:2,index:i,
                    hidden:!chart.getDataVisibility(i),
                  };
                });
              }
            }
          },
          datalabels:{
            display:(ctx)=>{
              const val=ctx.dataset.data[ctx.dataIndex];
              const tot=ctx.dataset.data.reduce((a,b)=>a+b,0);
              return tot>0 && val/tot>0.04;
            },
            formatter:(value,ctx)=>{
              const tot=ctx.dataset.data.reduce((a,b)=>a+b,0);
              const pct=tot?Math.round(value/tot*100):0;
              return `${value}\n${pct}%`;
            },
            color:'#fff',
            font:{size:10,weight:'bold'},
            textAlign:'center',
          },
          tooltip:{
            callbacks:{
              label:(item)=>{
                const pct=total2?Math.round(item.raw/total2*100):0;
                return ` ${item.label}: ${item.raw} (${pct}%) — click to drill down`;
              }
            }
          }
        }
      }
    });
    return ()=>{ chart1.current?.destroy(); chart2.current?.destroy(); };
  }, [stats]);

  if (!stats) return <div className="loader">Loading…</div>;
  const hint = <span className="drill-hint">↗ Click to filter Catalog</span>;
  return (
    <div>
      <div className="notice orange"><strong>⚠️ To-Be Portfolio:</strong> This portal reflects the <em>future state</em> per internal planning documents. New generic L2 SKUs go live <strong>1 Dec 2026</strong>. All non-generic SKUs retired by <strong>May 2027</strong>.</div>
      <div className="kpi-row">
        <div className="kpi" title="Click to see all services" onClick={()=>onDrillDown&&onDrillDown({statusContains:'', _ts:Date.now()})}>

// ─── Catalog Tab ─────────────────────────────────────────────────────────────
function Catalog({onSelect, drillFilter, onAdd, onEdit}) {
  const [rows, setRows]       = useState([]);
  const [total, setTotal]     = useState(0);
  const [filters, setFilters] = useState({journeys:[],statuses:[],actions:[]});
  const [q, setQ]             = useState('');
  const [journey, setJourney] = useState('');
  const [status, setStatus]   = useState('');
  const [action, setAction]   = useState('');

  // Apply drill-down filter from charts / KPI cards / global search
  useEffect(() => {
    if (!drillFilter) return;
    if (drillFilter.q              !== undefined) { setQ(drillFilter.q);                  setJourney(''); setAction(''); setStatus(''); }
    if (drillFilter.action         !== undefined) { setAction(drillFilter.action);         setJourney(''); setQ(''); setStatus(''); }
    if (drillFilter.journey        !== undefined) { setJourney(drillFilter.journey);       setAction('');  setQ(''); setStatus(''); }
    if (drillFilter.statusContains !== undefined) { setStatus(drillFilter.statusContains); setAction('');  setQ(''); setJourney(''); }
  }, [drillFilter]);
  const [page, setPage]       = useState(0);
  const [sortCol, setSortCol] = useState('sku');
  const [sortDir, setSortDir] = useState(1);
  const PER = 20;

  useEffect(() => { api.get('/filters').then(r => setFilters(r)); }, []);
  useEffect(() => {
    const params = new URLSearchParams();
    if (q)       params.set('q', q);
    if (journey) params.set('journey', journey);
    if (status)  params.set('status', status);
    if (action)  params.set('action', action);
    api.get(`/services?${params}`).then(r => { setRows(r.data||[]); setTotal(r.total||0); setPage(0); });
  }, [q, journey, status, action]);

  const sorted = [...rows].sort((a,b) => {
    const av = String(a[sortCol]||''), bv = String(b[sortCol]||'');
    return sortDir * av.localeCompare(bv);
  });
  const pageRows = sorted.slice(page*PER, (page+1)*PER);

  const doSort = col => {
    if (sortCol === col) setSortDir(d => -d);
    else { setSortCol(col); setSortDir(1); }
  };
  const arrow = col => sortCol===col ? (sortDir===1?' ↑':' ↓') : '';

  return (
    <div>
      <div className="card">
        <div className="ttoolbar">
          <input type="search" placeholder="🔍 Search SKU, name, scope…" value={q} onChange={e=>setQ(e.target.value)}/>
          <select value={journey} onChange={e=>setJourney(e.target.value)}>
            <option value="">All Journeys</option>
            {filters.journeys?.map(j=><option key={j}>{j}</option>)}
          </select>
          <select value={status} onChange={e=>setStatus(e.target.value)}>
            <option value="">All Statuses</option>
            {filters.statuses?.map(s=><option key={s}>{s}</option>)}
          </select>
          <select value={action} onChange={e=>setAction(e.target.value)}>
            <option value="">All Actions</option>
            {filters.actions?.map(a=><option key={a}>{a}</option>)}
          </select>
          {(action||journey||status||q) && (
            <span style={{fontSize:11,background:'#e8f4fc',color:'#0070b1',border:'1px solid #0070b166',borderRadius:4,padding:'3px 8px',display:'flex',alignItems:'center',gap:5}}>
              🔍 {q ? `Search: "${q}"` : `Filtered: ${action||journey||status}`}
              <button onClick={()=>{setAction('');setJourney('');setStatus('');setQ('');}} style={{border:'none',background:'none',cursor:'pointer',color:'#bb0000',fontWeight:700,fontSize:13,lineHeight:1}}>✕</button>
            </span>
          )}
          <button onClick={onAdd} style={{marginLeft:'auto',padding:'6px 14px',background:'var(--green)',color:'#fff',border:'none',borderRadius:5,fontWeight:700,fontSize:12,cursor:'pointer'}}>
            ➕ Add Service
          </button>
          <span style={{fontSize:11,color:'#6a6d73'}}>{total} services</span>
        </div>
        <div style={{overflowX:'auto'}}>
          <table>
            <thead><tr>
              {['sku','name','journey','status','action'].map(c=>(
                <th key={c} onClick={()=>doSort(c)}>{c.charAt(0).toUpperCase()+c.slice(1)}{arrow(c)}</th>
              ))}
              <th>Sizes</th>
              <th>Scope</th>
              <th style={{width:32}}></th>
            </tr></thead>
            <tbody>
              {pageRows.length===0 && <tr><td colSpan={7} style={{textAlign:'center',color:'#6a6d73',padding:28,fontStyle:'italic'}}>No services match your filters.</td></tr>}
              {pageRows.map(s => {
                const jc = JOURNEY_C[s.journey]||'#6a6d73';
                const rowCls = `row-${(s.action||'').toLowerCase()}`;
                return (
                  <tr key={s.sku} className={rowCls} onClick={()=>onSelect(s)}>
                    <td><a href={`${CAT}${s.sku}`} target="_blank" rel="noreferrer" className="sku-link" onClick={e=>e.stopPropagation()}>#{s.sku}</a></td>
                    <td style={{fontWeight:600,color:'#003366',maxWidth:220,lineHeight:1.4}}>
                      {s.name}
                      {s._manual && <span className="manual-badge">MANUAL</span>}
                    </td>
                    <td><span className="pill" style={{background:jc+'22',color:jc,border:`1px solid ${jc}66`}}>{s.journey}</span></td>
                    <td><Pill text={s.status} colorMap={STATUS_C}/></td>
                    <td><Pill text={s.action} colorMap={ACTION_C}/></td>
                    <td style={{fontSize:11}}>{s.sizes?.length?s.sizes.join(', '):'—'}</td>
                    <td style={{maxWidth:260,fontSize:11,color:'#6a6d73',lineHeight:1.4}}>{(s.scope||'').substring(0,110)}{s.scope?.length>110?'…':''}</td>
                    <td onClick={e=>e.stopPropagation()}>
                      <button
                        title="Edit this service"
                        onClick={e=>{e.stopPropagation(); onEdit&&onEdit(s);}}
                        style={{background:'none',border:'1px solid var(--border)',borderRadius:4,cursor:'pointer',padding:'2px 6px',fontSize:12,color:'var(--blue)'}}>
                        ✏️
                      </button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <div className="pager">
          <span>Showing {Math.min(page*PER+1,total)}–{Math.min((page+1)*PER,total)} of {total}</span>
          <div style={{display:'flex',gap:6}}>
            <button className="pbtn" disabled={page===0} onClick={()=>setPage(p=>p-1)}>← Prev</button>
            <button className="pbtn" disabled={(page+1)*PER>=total} onClick={()=>setPage(p=>p+1)}>Next →</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── ServiceForm modal ────────────────────────────────────────────────────────
const EMPTY_SVC = { sku:'', name:'', journey:'New Implementation', status:'Active', action:'ACTIVE', sizes:'', owner:'', scope:'', notes:'' };
const JOURNEY_OPTS = ['New Implementation','System Conversion','Expansion & Tuning','DMLT Cross Services','System Migration / PEX','Retiring','Uncategorised'];
const STATUS_OPTS  = ['Active','Active / TBD','Coming Dec 2026','Coming 2705','Active — Merging','Active — Transferring to Finance','Retiring Jan 2027','Retiring (Obsolete)','Retiring — Moving to Success Plans','Retiring'];
const ACTION_OPTS  = ['NEW','UPDATE','MERGE','SPLIT','RETIRE','ACTIVE','TRANSFER'];

function ServiceForm({ svc, onClose, onSaved }) {
  const isEdit = !!(svc && svc.sku);
  const [form, setForm] = React.useState(() => isEdit
    ? { ...svc, sizes: Array.isArray(svc.sizes) ? svc.sizes.join(', ') : (svc.sizes || '') }
    : { ...EMPTY_SVC });
  const [saving, setSaving] = React.useState(false);
  const [err,    setErr]    = React.useState('');

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const submit = async () => {
    if (!form.sku.trim())  return setErr('SKU is required.');
    if (!form.name.trim()) return setErr('Name is required.');
    setSaving(true); setErr('');
    const payload = {
      ...form,
      sizes: form.sizes.split(',').map(s => s.trim()).filter(Boolean),
    };
    const url    = isEdit ? `/api/services/${encodeURIComponent(form.sku)}` : '/api/services';
    const method = isEdit ? 'PUT' : 'POST';
    const r = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const j = await r.json();
    setSaving(false);
    if (!j.ok) return setErr(j.error || 'Save failed.');
    onSaved();
    onClose();
  };

  const doDelete = async () => {
  const msg = svc?._manual
    ? `Permanently delete #${form.sku}? This cannot be undone.`
    : `Hide #${form.sku} from the catalog? It stays in services.json on disk but won't appear in the portal. You can restore it by editing manual-services.json.`;
  if (!window.confirm(msg)) return;
    const r = await fetch(`/api/services/${encodeURIComponent(form.sku)}`, { method: 'DELETE' });
    const j = await r.json();
    if (!j.ok) return setErr(j.error || 'Delete failed.');
    onSaved(); onClose();
  };

  return (
    <div className="sform-ov show" onClick={e => e.target.className === 'sform-ov show' && onClose()}>
      <div className="sform">
        <div className="sform-hdr">
          <div>
            <div style={{fontSize:11,opacity:.75,marginBottom:2}}>{isEdit ? `Editing #${form.sku}` : 'New Service'}</div>
            <div style={{fontSize:15,fontWeight:700}}>{isEdit ? 'Edit Service' : 'Add Service Manually'}</div>
          </div>
          <button onClick={onClose} style={{background:'rgba(255,255,255,.2)',border:'none',color:'#fff',fontSize:18,cursor:'pointer',borderRadius:4,width:28,height:28}}>✕</button>
        </div>
        <div className="sform-body">
          <div>
            <label>SKU *</label>
            <input value={form.sku} onChange={e=>set('sku',e.target.value)} disabled={isEdit} placeholder="e.g. 50112345"/>
          </div>
          <div>
            <label>Owner</label>
            <input value={form.owner} onChange={e=>set('owner',e.target.value)} placeholder="Service owner name"/>
          </div>
          <div className="full">
            <label>Name *</label>
            <input value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Full service name"/>
          </div>
          <div>
            <label>Journey</label>
            <select value={form.journey} onChange={e=>set('journey',e.target.value)}>
              {JOURNEY_OPTS.map(j=><option key={j}>{j}</option>)}
            </select>
          </div>
          <div>
            <label>Status</label>
            <select value={form.status} onChange={e=>set('status',e.target.value)}>
              {STATUS_OPTS.map(s=><option key={s}>{s}</option>)}
            </select>
          </div>
          <div>
            <label>Action</label>
            <select value={form.action} onChange={e=>set('action',e.target.value)}>
              {ACTION_OPTS.map(a=><option key={a}>{a}</option>)}
            </select>
          </div>
          <div>
            <label>T-shirt Sizes <span style={{fontWeight:400,textTransform:'none'}}>(comma-separated)</span></label>
            <input value={form.sizes} onChange={e=>set('sizes',e.target.value)} placeholder="XS, S, M, L, XL"/>
          </div>
          <div className="full">
            <label>Scope</label>
            <textarea value={form.scope} onChange={e=>set('scope',e.target.value)} placeholder="Describe what this service covers…"/>
          </div>
          <div className="full">
            <label>Notes / Planning Status</label>
            <textarea value={form.notes} onChange={e=>set('notes',e.target.value)} placeholder="Planning decisions, dependencies, open items…"/>
          </div>
          {err && <div className="full" style={{color:'#bb0000',fontSize:11,fontWeight:600}}>{err}</div>}
        </div>
        <div className="sform-foot">
          {isEdit && (
            <button className="sbtn danger" onClick={doDelete} style={{marginRight:'auto'}}
              title={svc._manual ? 'Permanently remove this service' : 'Hide this service from the catalog (seed data is preserved on disk)'}>
              🗑 {svc._manual ? 'Delete' : 'Hide'}
            </button>
          )}
          <button className="sbtn ghost" onClick={onClose}>Cancel</button>
          <button className="sbtn primary" onClick={submit} disabled={saving}>
            {saving ? 'Saving…' : (isEdit ? '💾 Save Changes' : '➕ Add Service')}
          </button>
        </div>
      </div>
    </div>
  );
}

    {id:'overview', label:'📊 Overview'},
    {id:'journey',  label:'🗺️ Journey'},
    {id:'catalog',  label:`📋 Catalog (${stats?.total||'…'})`},
    {id:'dmlt',     label:'🗂️ DMLT'},
    {id:'retiring', label:`🔴 Retiring (${stats?.retiring||'…'})`},
    {id:'rules',    label:'📜 Rules'},
  ];

  return (
    <>
      <header className="hdr">
        <div style={{display:'flex',alignItems:'center'}}>
          <div className="logo">SAP</div>
          <div>
            <div style={{fontSize:16,fontWeight:700}}>Data &amp; AI PS Portfolio</div>
            <div style={{fontSize:11,opacity:.75}}>To-Be · Professional Services · Oct 2026</div>
          </div>
        </div>
        <div style={{textAlign:'right',fontSize:11,opacity:.9}}>
          <div style={{display:'flex',alignItems:'center',gap:5,background:'rgba(255,255,255,.15)',borderRadius:12,padding:'3px 10px',fontWeight:600}}>
            <span style={{width:7,height:7,background:'#4caf50',borderRadius:'50%',display:'inline-block'}}></span>
            {stats?.source==='mcp-live' ? 'Live MCP' : 'Document Seed'}
          </div>
          <div style={{marginTop:4}}>{stats?.total||'–'} services total</div>
        </div>
      </header>

      <nav className="nav">
        <div className="nav-tabs">
          {tabs.map(t => (
            <button key={t.id} className={`nbtn${tab===t.id?' on':''}`} onClick={()=>setTab(t.id)}>{t.label}</button>
          ))}
        </div>
        <div className="nav-search">
          <input
            type="search"
            placeholder="🔍 Search services…"
            value={navQ}
            onChange={e => setNavQ(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && doNavSearch()}
          />
          <button onClick={() => doNavSearch()}>Search</button>
        </div>
      </nav>

      <div className="main">
        <RefreshBar meta={stats} onRefresh={doRefresh} loading={loading}/>
        {tab==='overview' && <Overview stats={stats} onDrillDown={handleDrillDown}/>}
        {tab==='journey'  && <Journey  onSelect={setSelected}/>}
        {tab==='catalog'  && <Catalog  onSelect={setSelected} drillFilter={drillFilter} onAdd={() => setFormSvc({})} onEdit={svc => setFormSvc(svc)}/>}
        {tab==='dmlt'     && <DMLTTab  onSelect={setSelected}/>}
        {tab==='retiring' && <RetiringTab onSelect={setSelected}/>}
        {tab==='rules'    && <RulesTab/>}
      </div>

      <Modal svc={selected} onClose={() => setSelected(null)} onEdit={svc => { setSelected(null); setFormSvc(svc); }}/>
      {formSvc !== null && (
        <ServiceForm
          svc={Object.keys(formSvc).length === 0 ? null : formSvc}
          onClose={() => setFormSvc(null)}
          onSaved={() => { loadStats(); setDrillFilter(d => d ? {...d, _ts: Date.now()} : {_ts: Date.now()}); }}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
